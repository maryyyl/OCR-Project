apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ocr-platform
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.1
          env:
            - name: MYSQL_DATABASE
              value: ocr_platform
            - name: MYSQL_USER
              value: ocr_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi