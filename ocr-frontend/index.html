<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aifa_-_vezilka_-_tranparent%20(1).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Платформа</title>
      <style>
          .app-footer {
              width: 100%; /* од крај до крај */
              background: #111827;
              color: #e5e7eb;
              padding: 40px 60px;
              font-family: 'Segoe UI', sans-serif;
              box-sizing: border-box;
          }

          .footer-content {
              max-width: 1280px; /* ограничено на големина на content */
              margin: 0 auto;
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              gap: 40px;
          }

          .footer-left h3 {
              margin-bottom: 10px;
              font-size: 20px;
          }

          .footer-left p {
              font-size: 14px;
              opacity: 0.8;
              max-width: 250px;
          }

          .footer-center {
              display: flex;
              gap: 40px;
          }

          .stat {
              text-align: center;
          }

          .number {
              display: block;
              font-size: 22px;
              font-weight: bold;
          }

          .label {
              font-size: 13px;
              opacity: 0.7;
          }

          .footer-right p {
              font-size: 13px;
              margin: 4px 0;
              opacity: 0.8;
          }

          /* Responsive */
          @media (max-width: 768px) {
              .footer-content {
                  flex-direction: column;
                  text-align: center;
                  align-items: center;
              }

              .footer-center {
                  justify-content: center;
              }
          }
      </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

  </body>
</html>
